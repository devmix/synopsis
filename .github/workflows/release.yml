# Release Pipeline — triggered on version tags (v*).
# GoReleaser (.goreleaser.yaml) is the single build source: it builds all
# platforms, packages archives and publishes the GitHub Release with assets
# and SHA256SUMS.txt.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & publish (GoReleaser)
    runs-on: ubuntu-latest
    env:
      ZIG_VERSION: "0.16.0"
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so GoReleaser can generate changelog notes.
          fetch-depth: 0

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"
          cache: true

      # Symlink (not move) so Zig can resolve its bundled libraries, which
      # the darwin cross-build needs for libSystem.tbd. Asset layout since
      # 0.16: zig-<arch>-<os>-<version>.tar.xz -> top dir of the same name.
      - name: Install Zig ${{ env.ZIG_VERSION }}
        run: |
          curl -fsSLo /tmp/zig.tar.xz \
            "https://ziglang.org/download/${{ env.ZIG_VERSION }}/zig-x86_64-linux-${{ env.ZIG_VERSION }}.tar.xz"
          tar xfJ /tmp/zig.tar.xz -C /opt/
          ln -sf "/opt/zig-x86_64-linux-${{ env.ZIG_VERSION }}/zig" /usr/local/bin/zig
          zig version

      - name: Run GoReleaser (release)
        uses: goreleaser/goreleaser-action@v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
