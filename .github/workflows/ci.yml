# CI Pipeline — test, lint, coverage.
# Cross-platform packaging is not built here on purpose: `go test` already
# compiles and links the whole project natively (CGO + FTS5/VEC), and the repo
# has no OS-conditional code. The full zig cross-build runs in release.yml at
# tag time, when it actually matters. Keeping dev runs fast.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs when a new commit is pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25.5"

jobs:
  # ------------------------------------------------------------------
  # Test — run the full test suite with race detector. This also compiles
  # and links every package (including cmd/app) natively, so it doubles as
  # the dev-branch build check; a separate `go build` job would add nothing.
  # CGO_CFLAGS enables FTS5/VEC in the bundled go-sqlite3 build; without
  # them fts5-dependent tests would silently run against a degraded engine.
  # ------------------------------------------------------------------
  test:
    name: Test (ubuntu-latest)
    runs-on: ubuntu-latest
    env:
      CGO_CFLAGS: "-DSQLITE_ENABLE_FTS5 -DSQLITE_ENABLE_VEC"
      # FTS5's bm25 scoring calls libm; the cgo test binaries need it linked.
      CGO_LDFLAGS: "-lm"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc

      - name: Run tests with race detector
        run: go test -race ./...

  # ------------------------------------------------------------------
  # Lint — golangci-lint static analysis.
  # ------------------------------------------------------------------
  lint:
    name: Lint (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # golangci-lint v2 is required: the last v1 release (v1.64.x) was built
      # with Go 1.24 and refuses to target this module's go 1.25 directive.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.12
          args: ./...

  # ------------------------------------------------------------------
  # Coverage — collect coverage; summary is printed to the job log.
  # Gated on test: re-running the whole suite for a failing build is wasted minutes.
  # ------------------------------------------------------------------
  coverage:
    name: Coverage (ubuntu-latest)
    runs-on: ubuntu-latest
    needs: [test]
    env:
      CGO_CFLAGS: "-DSQLITE_ENABLE_FTS5 -DSQLITE_ENABLE_VEC"
      CGO_LDFLAGS: "-lm"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc

      - name: Run tests with coverage
        run: |
          go test -race -coverprofile=coverage.out -covermode=atomic ./...
          # Print summary to logs.
          go tool cover -func=coverage.out | tail -1

      # Render a per-package table into the job summary so it is visible on
      # the Actions run page without opening the log (GitHub has no native
      # coverage UI; this keeps everything in-repo).
      - name: Coverage summary
        run: |
          {
            echo "## Test coverage"
            echo ""
            echo "| Package | Coverage |"
            echo "|---------|--------:|"
            awk '
              $1 == "" || /^mode:/ { next }
              {
                file = $1; sub(/:.*/, "", file)
                mod = "github.com/devmix/synopsis/"
                if (index(file, mod)) rel = substr(file, index(file, mod) + length(mod)); else rel = file
                n = split(rel, segs, "/")
                dir = segs[1]
                for (i = 2; i < n; i++) dir = dir "/" segs[i]
                stmts[dir] += $2
                if ($3 > 0) cov[dir] += $2
              }
              END { for (d in stmts) printf "| %s | %.1f%% |\n", d, 100 * cov[d] / stmts[d] }
            ' coverage.out | sort
            echo ""
            TOTAL=$(go tool cover -func=coverage.out | tail -1 | awk '{print $NF}')
            echo "**Total: ${TOTAL}**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          retention-days: 30
