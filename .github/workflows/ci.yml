# CI Pipeline — test, lint, cross-compile (via GoReleaser), coverage.
# Triggered on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs when a new commit is pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25.5"
  ZIG_VERSION: "0.16.0"

jobs:
  # ------------------------------------------------------------------
  # Test — run the full test suite with race detector.
  # CGO_CFLAGS enables FTS5/VEC in the bundled go-sqlite3 build; without
  # them fts5-dependent tests would silently run against a degraded engine.
  # Scoped to this job only: it must not leak into the goreleaser build,
  # which sets its own per-target CGO_CFLAGS from .goreleaser.yaml.
  # ------------------------------------------------------------------
  test:
    name: Test (ubuntu-latest)
    runs-on: ubuntu-latest
    env:
      CGO_CFLAGS: "-DSQLITE_ENABLE_FTS5 -DSQLITE_ENABLE_VEC"
      # FTS5's bm25 scoring calls libm; the cgo test binaries need it linked.
      CGO_LDFLAGS: "-lm"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc

      - name: Run tests with race detector
        run: go test -race ./...

  # ------------------------------------------------------------------
  # Lint — golangci-lint static analysis.
  # ------------------------------------------------------------------
  lint:
    name: Lint (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # golangci-lint v2 is required: the last v1 release (v1.64.x) was built
      # with Go 1.24 and refuses to target this module's go 1.25 directive.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.12
          args: ./...

  # ------------------------------------------------------------------
  # Build — full GoReleaser pipeline (build + archive + checksums) in
  # snapshot mode, so CI validates exactly what the release produces.
  # All platforms are cross-compiled via Zig from one job using
  # .goreleaser.yaml as the single build source of truth.
  # Gated on test+lint: no point cross-compiling five targets for red code.
  # ------------------------------------------------------------------
  build:
    name: Build all platforms (GoReleaser snapshot)
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # Symlink (not move) so Zig can resolve its bundled libraries, which
      # the darwin cross-build needs for libSystem.tbd. Asset layout since
      # 0.16: zig-<arch>-<os>-<version>.tar.xz -> top dir of the same name.
      - name: Install Zig ${{ env.ZIG_VERSION }}
        run: |
          curl -fsSLo /tmp/zig.tar.xz \
            "https://ziglang.org/download/${{ env.ZIG_VERSION }}/zig-x86_64-linux-${{ env.ZIG_VERSION }}.tar.xz"
          tar xfJ /tmp/zig.tar.xz -C /opt/
          ln -sf "/opt/zig-x86_64-linux-${{ env.ZIG_VERSION }}/zig" /usr/local/bin/zig
          zig version

      - name: Run GoReleaser (snapshot)
        uses: goreleaser/goreleaser-action@v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --snapshot --clean

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: goreleaser-dist
          path: dist/
          retention-days: 7

  # ------------------------------------------------------------------
  # Coverage — collect coverage; summary is printed to the job log.
  # Gated on test: re-running the whole suite for a failing build is wasted minutes.
  # ------------------------------------------------------------------
  coverage:
    name: Coverage (ubuntu-latest)
    runs-on: ubuntu-latest
    needs: [test]
    env:
      CGO_CFLAGS: "-DSQLITE_ENABLE_FTS5 -DSQLITE_ENABLE_VEC"
      CGO_LDFLAGS: "-lm"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc

      - name: Run tests with coverage
        run: |
          go test -race -coverprofile=coverage.out -covermode=atomic ./...
          # Print summary to logs.
          go tool cover -func=coverage.out | tail -1
