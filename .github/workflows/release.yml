# Release Pipeline — triggered on version tags (v*).
# GoReleaser (.goreleaser.yaml) is the single build source: it builds all
# platforms, packages archives and publishes the GitHub Release with assets
# and SHA256SUMS.txt.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & publish (GoReleaser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so GoReleaser can generate changelog notes.
          fetch-depth: 0

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"
          cache: true

      # Symlink (not move) so Zig can resolve its bundled libraries, which
      # the darwin cross-build needs for libSystem.tbd.
      - name: Install Zig 0.16.0
        run: |
          curl -fsSL "https://ziglang.org/builds/zig-linux-x86_64-0.16.0.tar.xz" \
            | tar xfJ -C /opt/
          ln -sf "/opt/zig-linux-x86_64-0.16.0/zig" /usr/local/bin/zig
          zig version

      - name: Run GoReleaser (release)
        uses: goreleaser/goreleaser-action@v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
