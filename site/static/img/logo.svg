<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">
    <defs>
        <filter id="glow5" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="3.5" result="blur" />
            <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
    </defs>
    <rect width="100" height="100" rx="16" fill="#0a0e13"/>

    <!-- Поток 1 (Lexical) -->
    <circle cx="20" cy="30" r="3" fill="#8b98a6" />
    <path d="M20,30 C35,30 40,50 50,50" fill="none" stroke="rgba(158, 180, 204, 0.28)" stroke-width="2" />

    <!-- Поток 2 (Semantic) -->
    <circle cx="20" cy="70" r="3" fill="#8b98a6" />
    <path d="M20,70 C35,70 40,50 50,50" fill="none" stroke="rgba(158, 180, 204, 0.28)" stroke-width="2" />

    <!-- Слияние -->
    <line x1="50" y1="50" x2="75" y2="50" stroke="#a8ff3e" stroke-width="2" opacity="0.5" />

    <!-- Результат -->
    <g filter="url(#glow5)">
        <rect x="72" y="42" width="16" height="16" rx="4" transform="rotate(45 80 50)" fill="#a8ff3e" />
    </g>

    <!-- Сетка контекста -->
    <g stroke="rgba(158, 180, 204, 0.14)" stroke-width="1">
        <line x1="10" y1="50" x2="90" y2="50" stroke-dasharray="2 4" />
    </g>
</svg>